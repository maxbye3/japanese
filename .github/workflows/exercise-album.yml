name: Refresh exercise album
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/*exercise-album.mjs', 'data/exercise-album.json', '.github/workflows/exercise-album.yml']
permissions:
  contents: write
concurrency:
  group: exercise-album-refresh
  cancel-in-progress: false
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read previous snapshot
        run: |
          set +e
          git ls-remote --exit-code --heads origin exercise-album-data > "$RUNNER_TEMP/album-branch"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch origin refs/heads/exercise-album-data:refs/remotes/origin/exercise-album-data
            git show origin/exercise-album-data:exercise-album.json > "$RUNNER_TEMP/previous-album.json"
          elif [ "$status" -eq 2 ]; then
            cp data/exercise-album.json "$RUNNER_TEMP/previous-album.json"
          else
            exit "$status"
          fi
      - name: Check public album
        run: node scripts/update-exercise-album.mjs "$RUNNER_TEMP/previous-album.json" "$RUNNER_TEMP/exercise-album.json"
      - name: Publish count and stamps (no photos)
        run: |
          if git show-ref --quiet refs/remotes/origin/exercise-album-data; then
            git switch --create exercise-album-data --track origin/exercise-album-data
          elif git ls-remote --exit-code --heads origin exercise-album-data; then
            git fetch origin exercise-album-data:refs/remotes/origin/exercise-album-data
            git switch --create exercise-album-data --track origin/exercise-album-data
          else
            git switch --orphan exercise-album-data
          fi
          cp "$RUNNER_TEMP/exercise-album.json" exercise-album.json
          git add exercise-album.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh exercise album count'
          git push origin HEAD:exercise-album-data
